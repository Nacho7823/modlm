[project]
name = "llmapp"
version = "0.1.0"
description = "LLM Chat TUI Application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.90.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-textual>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"